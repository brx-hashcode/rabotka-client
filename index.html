    <script>
      // The installed app opens on the feed, never the landing page. The
      // manifest's start_url says /home, but iPhone's "Add to Home Screen"
      // can keep the page it was added from — usually / — so a launch from
      // the home screen that lands there is sent on before anything paints.
      if (
        location.pathname === "/" &&
        (navigator.standalone === true ||
          matchMedia("(display-mode: standalone)").matches)
      ) {
        location.replace("/home" + location.search);
      }
    </script>
    <script>
      // Lime status bar on the home screen from the very first paint: Safari
      // picks its bar colour when the page first paints and only looks again
      // on scroll, so setting it from React (BrandHero) alone was too late.
      if (location.pathname === "/home") {
        document.documentElement.style.backgroundColor = "#CBFFA5";
        document.documentElement.style.setProperty("--status-bar", "#CBFFA5");
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", "#CBFFA5");
      }
    </script>
