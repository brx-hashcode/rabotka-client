      #app-loading {
        position: fixed;

        display: flex;
        align-items: center;
        justify-content: center;
        background: hsl(40 30% 98%);
        z-index: 9999;
      }
      #app-loading .logo-img {
        width: 64px;
        height: 64px;
        object-fit: contain;
        animation: splash-pulse 1.6s ease-in-out infinite;
      }
      #app-loading.is-hiding {
        opacity: 0;
        pointer-events: none;
        transition: opacity 220ms ease;
      }
      @keyframes splash-pulse {
        0%,
        100% {
          opacity: 0.65;
          transform: scale(0.97);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-loading .logo-img {
          animation: none;
        }
      }
    </style>
