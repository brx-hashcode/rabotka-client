name: Build and Deploy — Develop

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/rabotka-client

on:
  pull_request:
    branches:
      - develop
    types:
      - closed

jobs:
  build-and-push:
    name: Build and Push Image
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: write

    outputs:
      image-digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # Pin a recent BuildKit so type=gha cache uses the current GitHub
          # Actions Cache backend (the legacy reserve API was retired in 2025).
          # Without this, an older BuildKit fails cache export with
          # "failed to reserve cache" and the cache is never saved.
          driver-opts: image=moby/buildkit:v0.19.0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=develop
            type=sha,prefix=sha-,format=short

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=buildkit-develop
          # ignore-error keeps cache export best-effort: a GHA Cache outage logs
          # a warning instead of failing the build (image is already pushed).
          cache-to: type=gha,mode=max,scope=buildkit-develop,ignore-error=true

  deploy:
    name: Deploy to VPS (develop)
    runs-on: ubuntu-latest
    needs: build-and-push
    # Hard cap so a stalled VPS step fails fast instead of hanging for hours.
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch secrets from Vault
        id: vault
        run: |
          LOGIN_RESPONSE=$(curl -s --request POST \
            --data "{\"role_id\":\"${{ secrets.VAULT_ROLE_ID }}\",\"secret_id\":\"${{ secrets.VAULT_SECRET_ID }}\"}" \
            "${{ secrets.VAULT_ADDR }}/v1/auth/approle/login")
          TOKEN=$(echo "$LOGIN_RESPONSE" | jq -r '.auth.client_token')

          SECRET_RESPONSE=$(curl -s \
            --header "X-Vault-Token: $TOKEN" \
            "${{ secrets.VAULT_ADDR }}/v1/secret/data/apps/rabotka-client-develop")
          VAULT_SECRET=$(echo "$SECRET_RESPONSE" | jq -r '.data.data')
          echo "vite_backend_url=$(echo "$VAULT_SECRET" | jq -r '.VITE_BACKEND_URL')" >> $GITHUB_OUTPUT
          echo "vite_site_url=$(echo "$VAULT_SECRET" | jq -r '.VITE_SITE_URL')" >> $GITHUB_OUTPUT
          echo "port=$(echo "$VAULT_SECRET" | jq -r '.PORT')" >> $GITHUB_OUTPUT

          curl -sf --request POST \
            --header "X-Vault-Token: $TOKEN" \
            "${{ secrets.VAULT_ADDR }}/v1/auth/token/revoke-self" > /dev/null || true

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.VPS_PORT }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      # The VPS's IPv6 route to ghcr.io drops large layer transfers ("connection
      # reset by peer"), so pulling on the VPS is unreliable. Pull on the runner
      # (healthy GHCR connectivity) and stream the image to the VPS over SSH — the
      # VPS never talks to ghcr.io.
      - name: Load image onto VPS (bypass VPS→GHCR pull)
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/rabotka-client:latest"
          echo "Pulling $IMAGE on the runner..."
          docker pull "$IMAGE"
          echo "Streaming image to the VPS (docker save | ssh docker load)..."
          docker save "$IMAGE" | gzip -1 | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=60 \
            -o ServerAliveCountMax=10 \
            -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "gunzip | docker load"

      - name: Write .env and deploy on VPS
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=60 \
            -o ServerAliveCountMax=10 \
            -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cat > ~/rabotka-client/.env << 'EOF'
          CLIENT_IMAGE=ghcr.io/${{ github.repository_owner }}/rabotka-client:latest
          APP_ENV=develop
          CLIENT_DOMAIN=rabotka.${{ secrets.INFRA_DOMAIN }}
          VITE_BACKEND_URL=${{ steps.vault.outputs.vite_backend_url }}
          VITE_SITE_URL=${{ steps.vault.outputs.vite_site_url }}
          VITE_PORT=${{ steps.vault.outputs.port }}
          EOF
          sed -i 's/^[[:space:]]*//' ~/rabotka-client/.env
          cd ~/rabotka-client && git fetch origin develop && git reset --hard origin/develop && \
          docker compose -f docker-compose.prod.yml up -d --remove-orphans"

  smoke-test:
    name: Smoke Test (develop)
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: read

    steps:
      - name: Wait for container to stabilize
        run: sleep 45

      - name: Check client is reachable
        run: |
          for i in $(seq 1 12); do
            STATUS=$(curl -o /dev/null -s -w "%{http_code}" \
              --max-time 20 \
              "https://rabotka.${{ secrets.INFRA_DOMAIN }}")
            echo "Attempt $i — HTTP status: $STATUS"
            [ "$STATUS" = "200" ] && exit 0
            sleep 15
          done
          echo "Client did not return 200 after 12 attempts"
          exit 1

      - name: Slack notify success
        if: success()
        env:
          MESSAGE: |
            Deployment Succeeded (client develop)
            ${{ github.event.pull_request.title }}
            Branch: ${{ github.ref_name }}
            Author: ${{ github.actor }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "attachments": [
                {
                  "color": "#00B32C",
                  "text": ${{ toJSON(env.MESSAGE) }}
                }
              ]
            }

      - name: Slack notify failure
        if: failure()
        env:
          MESSAGE: |
            Deployment Failed (client develop)
            ${{ github.event.pull_request.title }}
            Branch: ${{ github.ref_name }}
            Author: ${{ github.actor }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "attachments": [
                {
                  "color": "#B3000C",
                  "text": ${{ toJSON(env.MESSAGE) }}
                }
              ]
            }
