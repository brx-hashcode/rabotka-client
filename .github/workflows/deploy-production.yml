name: Build and Deploy — Production

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/rabotka-client

on:
  pull_request:
    branches:
      - main
    types:
      - closed

jobs:
  promote:
    name: Promote Develop Image to Production
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image-digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote image
        id: push
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          SOURCE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:develop"
          TARGET_LATEST="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          TARGET_SHA="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:prod-sha-${SHORT_SHA}"

          # Server-side retag: copies the manifest in-registry without pulling or
          # pushing image layers — instant, and guarantees prod ships the exact
          # bytes tested on develop (no rebuild).
          docker buildx imagetools create -t "$TARGET_LATEST" -t "$TARGET_SHA" "$SOURCE"
          DIGEST=$(docker buildx imagetools inspect "$TARGET_SHA" --format '{{.Manifest.Digest}}')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to VPS (production)
    runs-on: ubuntu-latest
    needs: promote
    permissions:
      contents: read
      packages: read

    steps:
      - name: Fetch secrets from Vault
        id: vault
        run: |
          LOGIN_RESPONSE=$(curl -s --request POST \
            --data "{\"role_id\":\"${{ secrets.VAULT_ROLE_ID_PROD }}\",\"secret_id\":\"${{ secrets.VAULT_SECRET_ID_PROD }}\"}" \
            "${{ secrets.VAULT_ADDR }}/v1/auth/approle/login")
          TOKEN=$(echo "$LOGIN_RESPONSE" | jq -r '.auth.client_token')

          SECRET_RESPONSE=$(curl -s \
            --header "X-Vault-Token: $TOKEN" \
            "${{ secrets.VAULT_ADDR }}/v1/secret/data/apps/rabotka-client-production")
          VAULT_SECRET=$(echo "$SECRET_RESPONSE" | jq -r '.data.data')
          echo "vite_backend_url=$(echo "$VAULT_SECRET" | jq -r '.VITE_BACKEND_URL')" >> $GITHUB_OUTPUT
          echo "vite_site_url=$(echo "$VAULT_SECRET" | jq -r '.VITE_SITE_URL')" >> $GITHUB_OUTPUT
          echo "port=$(echo "$VAULT_SECRET" | jq -r '.PORT')" >> $GITHUB_OUTPUT

          curl -sf --request POST \
            --header "X-Vault-Token: $TOKEN" \
            "${{ secrets.VAULT_ADDR }}/v1/auth/token/revoke-self" > /dev/null || true

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.VPS_PORT }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      # Runner→GHCR is reliable; this login is only used by the SSH-stream
      # fallback below (runner pulls the image, then streams it to the VPS).
      - name: Log in to GHCR (for fallback)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image on VPS (native, SSH-stream fallback)
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/rabotka-client:latest"
          DEST="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          SSHOPTS="-i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -p ${{ secrets.VPS_PORT }}"
          # Fast path: native pull on the VPS. Short 90s timeout × 3 so a
          # VPS→GHCR blackhole fails fast (~5 min) instead of hanging ~30 min.
          if ssh $SSHOPTS "$DEST" "ok=0; for i in 1 2 3; do timeout 90 docker pull '$IMAGE' && { ok=1; break; }; echo \"native pull attempt \$i stalled...\"; sleep 5; done; [ \$ok = 1 ]"; then
            echo "✅ Native pull succeeded"
          else
            # Fallback: the VPS can't pull from GHCR, but the runner can. Pull
            # here, then stream the image to the VPS over the (IPv4) SSH channel,
            # which is unaffected by the registry blackhole.
            echo "⚠️ Native pull stalled — streaming image to VPS over SSH"
            docker pull "$IMAGE"
            docker save "$IMAGE" | gzip -1 | ssh $SSHOPTS "$DEST" "gunzip | docker load"
            echo "✅ Image loaded on VPS via SSH stream"
          fi

      - name: Write .env and deploy on VPS
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=60 \
            -o ServerAliveCountMax=10 \
            -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cat > ~/rabotka-client-prod/.env << 'EOF'
          CLIENT_IMAGE=ghcr.io/${{ github.repository_owner }}/rabotka-client:latest
          APP_ENV=prod
          CLIENT_DOMAIN=${{ secrets.PROD_CLIENT_DOMAIN }}
          VITE_BACKEND_URL=${{ steps.vault.outputs.vite_backend_url }}
          VITE_SITE_URL=${{ steps.vault.outputs.vite_site_url }}
          VITE_PORT=${{ steps.vault.outputs.port }}
          EOF
          sed -i 's/^[[:space:]]*//' ~/rabotka-client-prod/.env
          cd ~/rabotka-client-prod && git fetch origin main && git reset --hard origin/main && \
          docker compose -f docker-compose.prod.yml up -d --remove-orphans && \
          docker image prune -af"

  smoke-test:
    name: Smoke Test (production)
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: read

    steps:
      - name: Wait for container to stabilize
        run: sleep 30

      - name: Check client is reachable
        run: |
          for i in 1 2 3; do
            STATUS=$(curl -o /dev/null -s -w "%{http_code}" \
              --max-time 20 \
              "https://${{ secrets.PROD_CLIENT_DOMAIN }}")
            echo "Attempt $i — HTTP status: $STATUS"
            [ "$STATUS" = "200" ] && exit 0
            sleep 15
          done
          echo "Client did not return 200 after 3 attempts"
          exit 1

      - name: Slack notify success
        if: success()
        env:
          MESSAGE: |
            Deployment Succeeded (client production)
            ${{ github.event.pull_request.title }}
            Branch: ${{ github.ref_name }}
            Author: ${{ github.actor }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "attachments": [
                {
                  "color": "#00B32C",
                  "text": ${{ toJSON(env.MESSAGE) }}
                }
              ]
            }

      - name: Slack notify failure
        if: failure()
        env:
          MESSAGE: |
            Deployment Failed (client production)
            ${{ github.event.pull_request.title }}
            Branch: ${{ github.ref_name }}
            Author: ${{ github.actor }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "attachments": [
                {
                  "color": "#B3000C",
                  "text": ${{ toJSON(env.MESSAGE) }}
                }
              ]
            }
