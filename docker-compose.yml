services:
  client:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL}
        VITE_SITE_URL: ${VITE_SITE_URL}
        # Empty by default: a local build has no business reporting to the
        # production Analytics property.
        VITE_GA_MEASUREMENT_ID: ${VITE_GA_MEASUREMENT_ID:-}
    container_name: rabotka_client
    restart: unless-stopped
    env_file:
      - .env
    environment:
      VITE_PORT: ${VITE_PORT:-3000}
    ports:
      - "${VITE_PORT:-3000}:${VITE_PORT:-3000}"
    networks:
      - rabotka_network

networks:
  rabotka_network:
    external: true
